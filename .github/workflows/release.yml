name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run: builds artifacts without publishing a release

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-22.04 }  # older glibc = wider Linux compatibility
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm minesteinkraft.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MinesteinKraft -DestinationPath MinesteinKraft-${{ matrix.name }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MinesteinKraft.app MinesteinKraft-${{ matrix.name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MinesteinKraft-${{ matrix.name }}.tar.gz -C dist MinesteinKraft

      - uses: actions/upload-artifact@v4
        with:
          name: MinesteinKraft-${{ matrix.name }}
          path: MinesteinKraft-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
