[project]
name = "minesteinkraft"
version = "0.2.0"
description = "Voxel game engine in Python (pygame-ce + moderngl + numpy)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5,<3",
    "moderngl>=5.10,<6",
    "PyGLM>=2.7,<3",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
